[project]
name = "dgx-spark-lab"
version = "0.1.0"
description = "Distributed AI experiments on two interconnected NVIDIA DGX Sparks"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "pydantic",
    "rich",
    "torch[gpu]>=2.13.0",
    "typer",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "mypy",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.workspace]
members = [
    "experiments/03-distributed-training",
    "experiments/05-gpudirect-rdma",
]

